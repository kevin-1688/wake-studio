<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>為你好</title>
<meta property="og:title" content="為你好｜亞洲家長控制欲模擬遊戲｜WAKE">
<meta property="og:description" content="從七歲到三十歲，每一週的時間都要給媽媽檢查。你會聽話、溝通，還是陽奉陰違？">
<meta property="og:image" content="https://wake.com.tw/assets/og-image.jpg">
<meta property="og:url" content="https://wake.com.tw/play/wei-ni-hao/">
<meta name="description" content="亞洲家長控制欲模擬遊戲：從七歲到三十歲，每一週的時間都要給媽媽檢查。你會聽話、溝通，還是陽奉陰違？">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --card:#fffcf5; --ink:#2b2622; --muted:#7b7067; --line:#e3d9c8;
  --accent:#0c8599; --accent-ink:#fff; --red:#e03131; --good:#2b8a3e; --bad:#c92a2a; --gold:#e8a700;
  --wall:#f1e4cc; --wall2:#e8d6b8; --floor:#c8a77e; --wood:#8a6240; --door:#b98a5e; --gap:#2b2118;
  --sky:#a5d8ff; --night:#1f2a48; --skin:#f2c9a0; --hair:#3b2a20;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1714; --card:#24201c; --ink:#f1e9de; --muted:#a69a8c; --line:#3a332c;
    --accent:#3bc9db; --accent-ink:#1a1714; --red:#ff6b6b; --good:#69db7c; --bad:#ff8787; --gold:#fcc419;
    --wall:#3a3128; --wall2:#332a22; --floor:#4a3a2a; --wood:#6b4b31; --door:#7a5a3d; --gap:#0d0a08;
    --sky:#3d6a8f; --night:#0f1528; --skin:#d9ae86; --hair:#1e1611;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1714; --card:#24201c; --ink:#f1e9de; --muted:#a69a8c; --line:#3a332c;
  --accent:#3bc9db; --accent-ink:#1a1714; --red:#ff6b6b; --good:#69db7c; --bad:#ff8787; --gold:#fcc419;
  --wall:#3a3128; --wall2:#332a22; --floor:#4a3a2a; --wood:#6b4b31; --door:#7a5a3d; --gap:#0d0a08;
  --sky:#3d6a8f; --night:#0f1528; --skin:#d9ae86; --hair:#1e1611;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6}
#app{max-width:880px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
h1{font-size:1.6rem;font-weight:900;margin:0;letter-spacing:.05em}
h1 small{font-size:.85rem;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.meters{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem}
.meter b{font-weight:900}
.bar{display:inline-block;width:64px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;margin-left:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.bar.red i{background:var(--red)}
.bar.low i{background:var(--bad)}
.mute{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.mute:hover{border-color:var(--accent)}
.scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--wall)}
.scene svg{display:block;width:100%;height:auto}
.ticker{background:var(--ink);color:var(--bg);font-size:.85rem;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker span{color:var(--accent);font-weight:700;margin-right:6px}
#panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;min-height:200px}
#panel h2{margin:0 0 6px;font-size:1.25rem}
#panel .kicker{color:var(--accent);font-weight:700;font-size:.85rem;letter-spacing:.08em}
#panel p{margin:.4em 0}
.mom{font-family:"LXGW WenKai TC","Noto Sans TC",serif;color:var(--red);font-size:1.08rem;border-left:3px solid var(--red);padding:4px 0 4px 12px;margin:10px 0}
.mom::before{content:"媽媽：";font-weight:700}
.mom.aside::before{content:""}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;transition:border-color .15s,transform .1s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:active:not(:disabled){transform:scale(.99)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice b{display:block}
.choice small{color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-left:8px}
/* 調色盤＋週行程 */
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.brush{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.92rem;cursor:pointer}
.brush[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.brush small{opacity:.75;margin-left:4px;font-size:.75rem}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.slot{position:relative;border:1.5px dashed var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 4px;min-height:74px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2}
button.slot:hover{border-color:var(--accent)}
.slot .day{font-size:.72rem;color:var(--muted)}
.slot .ic{font-size:1.5rem}
.slot .nm{font-size:.82rem;font-weight:700}
.slot.filled{border-style:solid}
.slot.over{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--bg))}
.slot.over .nm{color:var(--red)}
.slot.restored{border-color:var(--good)}
.slot.restored::after{content:"守住了";position:absolute;top:4px;right:6px;font-size:.62rem;color:var(--good);font-weight:700}
.slot.over::after{content:"媽媽改";position:absolute;top:4px;right:6px;font-size:.62rem;color:var(--red);font-weight:700}
.slot.secret::after{content:"偷偷的";position:absolute;top:4px;right:6px;font-size:.62rem;color:var(--accent);font-weight:700}
.slot.stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(1.7) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.left{font-size:.95rem;margin-top:8px}
.left b{color:var(--accent);font-size:1.15rem}
.forecast{font-size:.86rem;color:var(--muted);margin-top:4px}
.goal{border-left:4px solid var(--accent);background:var(--bg);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:.95rem}
.goal.boss{border-left-color:var(--bad)}
.goal.ok{border-left-color:var(--good);font-weight:700}
.goal.fail{border-left-color:var(--muted);color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--bad);color:#fff;margin-right:6px;vertical-align:middle}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.tip{font-size:.9rem;color:var(--muted);margin:4px 0 8px}
ul.notes{padding-left:1.2em;margin:.5em 0}
ul.notes li{margin:.2em 0}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
/* 關卡地圖 */
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.map:empty{display:none}
.chapter{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card);min-width:0}
.ch-name{font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nodes{display:flex;gap:6px}
.node{flex:1;display:flex;flex-direction:column;align-items:center;border-radius:8px;padding:4px 0;border:1.5px solid var(--line);background:var(--bg);line-height:1.25}
.node b{font-size:.95rem}
.node span{font-size:.7rem;color:var(--muted)}
.node.future{opacity:.55}
.node.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.node.boss{border-style:dashed}
.node.boss b{color:var(--bad);font-size:.72rem;letter-spacing:.05em}
.node.star b{color:var(--gold);font-size:1.1rem;letter-spacing:0}
.node.miss b{color:var(--muted);font-size:1.1rem;letter-spacing:0}
/* 結局 */
.verdict{font-size:1.5rem;font-weight:900;margin:.2em 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.stat .num{font-size:1.7rem;font-weight:900;line-height:1.1}
.stat small{color:var(--muted);font-size:.75rem}
.stars-sum{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);margin:12px 0}
.stars-sum>b{color:var(--gold);font-size:1.3rem}
.stars-sum ol{list-style:none;padding:0;margin:6px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.88rem}
.stars-sum li small{display:block;color:var(--muted);font-size:.75rem}
.stars-sum li.miss,.stars-sum li.skip{color:var(--muted)}
.help{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--muted);margin-top:14px}
footer{color:var(--muted);font-size:.78rem;margin-top:14px}
footer a{color:inherit}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
.rec{animation:blink 1.6s steps(1) infinite}
@keyframes peek{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
.eye{animation:peek 3s ease-in-out infinite}
@keyframes buzz{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(-1px,0)}94%{transform:translate(1px,0)}96%{transform:translate(-1px,0)}}
.buzz{animation:buzz 2.4s linear infinite;transform-box:fill-box}
@media (prefers-reduced-motion: reduce){.rec,.eye,.buzz,.slot.stamp{animation:none}}
@media (max-width:560px){
  .map{grid-template-columns:repeat(2,1fr)}
  .stars-sum ol{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  h1{font-size:1.3rem}
  .bar{width:44px}
  #panel{padding:14px}
  .week{grid-template-columns:repeat(4,1fr)}
  .btn.ghost{margin-left:0}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>為你好<small>亞洲家長控制欲模擬</small></h1>
    <div class="meters" id="meters"></div>
    <button class="mute" id="mute" hidden>音樂：開</button>
  </header>
  <nav class="map" id="map" aria-label="關卡地圖"></nav>
  <section class="scene">
    <svg id="scene" viewBox="0 0 800 300" role="img" aria-label="你的房間：書桌上的參考書、牆上的畫、門縫裡的眼睛"></svg>
    <div class="ticker" id="ticker"></div>
  </section>
  <section id="panel" aria-live="polite"></section>
  <footer>本作描寫一種常見的教養模式，角色皆為虛構，不是在評判任何一位家長——遊戲裡的媽媽，也曾經是被這樣養大的孩子。 <a href="../../works.html">← WAKE 作品檔案</a></footer>
</div>
<script src="game.js"></script>
</body>
</html>
