<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9L39JVR3DE"></script>
<script src="/assets/ga.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中和慧更豪｜問政藍圖（3D）｜WAKE</title>
<meta name="description" content="2026 新北市議員選舉中和選區候選人張志豪的在地政見與過往政績，標在 3D 的「中和島」上。">
<meta property="og:title" content="中和慧更豪｜問政藍圖（3D）｜WAKE">
<meta property="og:description" content="2026 新北市議員選舉中和選區候選人張志豪的在地政見與過往政績，標在 3D 的「中和島」上。">
<meta property="og:image" content="https://wake.com.tw/assets/og-image.jpg">
<meta property="og:url" content="https://wake.com.tw/projects/zhonghe-map/3d.html">
<link rel="canonical" href="https://wake.com.tw/projects/zhonghe-map/3d.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fraunces:ital,opsz,wght@1,9..144,600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="map3d.css">
<link rel="stylesheet" href="petition.css">
</head>
<body>
<div class="app">
  <main class="world">
    <div id="stage" aria-label="中和島 3D 地圖，標示張志豪政見與政績位置"></div>
    <div id="labels" aria-hidden="true"></div>

    <header class="brand">
      <img class="avatar" src="img/zhihao-avatar.webp" alt="新北市議員候選人張志豪" width="240" height="240">
      <div class="brand-t">
        <div class="eyebrow">2026 新北市議員 · 第 6 選區</div>
        <h1><span class="nw">中和慧更豪｜</span><span class="nw">問政藍圖</span></h1>
        <div class="who">候選人 <b>張志豪</b> · <a href="./">2D 版</a> · <a href="/works.html">WAKE-016</a></div>
      </div>
    </header>

    <nav class="tools" aria-label="地圖工具">
      <button type="button" class="tool" id="v-home"><span class="ic">⌂</span>全景</button>
      <button type="button" class="tool" id="v-top"><span class="ic">◎</span>鳥瞰</button>
      <button type="button" class="tool ch-tool" id="v-char"><span class="ic">☺</span>我的角色</button>
      <button type="button" class="tool" id="v-spin" aria-pressed="false"><span class="ic">↻</span>旋轉</button>
      <button type="button" class="tool" data-music><span class="ic">♪</span><span class="lbl">音樂</span></button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="tool" data-toggle="names" aria-pressed="true"><span class="ic">▭</span>名牌</button>
      <button type="button" class="tool" data-toggle="plan" aria-pressed="true"><span class="ic dot plan"></span>政見</button>
      <button type="button" class="tool" data-toggle="done" aria-pressed="true"><span class="ic dot done"></span>政績</button>
      <button type="button" class="tool" data-toggle="voice" aria-pressed="true"><span class="ic dot voice"></span>陳情</button>
      <button type="button" class="tool pet-add" data-pet-add><span class="ic">✎</span>我要陳情</button>
    </nav>

    <article class="card" id="card" data-kind="plan" hidden>
      <button type="button" class="x" id="card-close" aria-label="關閉">×</button>
      <div class="c-t" id="c-t"></div>
      <h3 id="c-h"></h3>
      <p id="c-p"></p>
      <div class="c-w" id="c-w"></div>
      <span class="more">點一下看全文</span>
    </article>

    <p class="credit">拖曳旋轉 · 滾輪或雙指縮放 · 點旗子看細節　地圖資料 © OpenStreetMap</p>
  </main>

  <aside class="index" aria-label="政見索引">
    <div class="ix-head">
      <div class="kicker">THE POLICY INDEX</div>
      <h2>中和，加速度。</h2>
      <p class="lede"><span id="count-plan"></span> 項 2026 政見 ／ <span id="count-done"></span> 項過往政績。點一項，飛到它在島上的位置。</p>
      <label class="search"><span class="sr">搜尋</span><input id="q" type="search" placeholder="搜尋政見、地點、關鍵字…" autocomplete="off"></label>
      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-pane="pane-plan" aria-selected="true">2026 政見</button>
        <button type="button" class="tab" role="tab" data-pane="pane-done" aria-selected="false">過往政績</button>
        <button type="button" class="tab" role="tab" data-pane="pane-voice" aria-selected="false">陳情 <span data-pet-count>0</span></button>
      </div>
    </div>
    <div class="ix-body">
      <section class="pane" id="pane-plan">
        <h3 class="grp">在地政見</h3><div id="l-plan"></div>
        <h3 class="grp">福利與全區政見</h3><div id="l-wide"></div>
      </section>
      <section class="pane" id="pane-voice" hidden>
        <h3 class="grp">議員你給我聽好了</h3>
        <div class="pet-cta"><p>在島上標出你住的地方哪裡需要改善，服務處審核後會公開在地圖上。</p><button type="button" class="pet-btn" data-pet-add>我要陳情</button></div>
        <div data-pet-list></div>
      </section>
      <section class="pane" id="pane-done" hidden>
        <h3 class="grp">有地點的政績</h3><div id="l-done"></div>
        <h3 class="grp">全區性政績</h3><div id="l-done-wide"></div>
        <h3 class="grp">舊政見 · 2026 版未再提</h3><div id="l-old"></div>
      </section>
    </div>
  </aside>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="map3d.js"></script>
<script src="ambient.js"></script>
<script src="petition.js"></script>
<script src="character.js"></script>
</body>
</html>
